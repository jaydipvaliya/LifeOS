databases:
  - name: lifeos-db
    plan: free
    databaseName: lifeos
    user: lifeos

services:
  - type: keyvalue
    name: lifeos-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: lifeos-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate --workspace=@lifeos/api && npm run build
    startCommand: npm run prisma:deploy --workspace=@lifeos/api && npm run start --workspace=@lifeos/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lifeos-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: 30
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: true
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: LifeOS <no-reply@lifeos.app>
      - key: SENTRY_DSN
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false

  - type: worker
    name: lifeos-worker
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace=@lifeos/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: WORKER_CONNECT_REDIS
        value: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lifeos-redis
          property: connectionString
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
