services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos_dev_password
      POSTGRES_DB: lifeos
    ports:
      - '5432:5432'
    volumes:
      - lifeos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeos -d lifeos']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lifeos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - lifeos_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lifeos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lifeos_minio
      MINIO_ROOT_PASSWORD: lifeos_minio_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - lifeos_miniodata:/data

volumes:
  lifeos_pgdata:
  lifeos_redisdata:
  lifeos_miniodata:
