databases:
  - name: lifeos-db
    plan: free
    databaseName: lifeos
    user: lifeos

services:
  - type: keyvalue
    name: lifeos-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: lifeos-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace=@lifeos/api && npm run build
    startCommand: npm run prisma:deploy --workspace=@lifeos/api && npm run start --workspace=@lifeos/api
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: lifeos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lifeos-redis
          property: connectionString
      - key: RUN_EMBEDDED_WORKER
        value: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: 30
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /tmp/lifeos-storage
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: EMAIL_PROVIDER
        value: none
      - key: EMAIL_FROM
        value: LifeOS <no-reply@lifeos.app>
