name: LifeOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: postgresql://lifeos:lifeos@localhost:5432/lifeos?schema=public
        run: npx prisma validate --schema=apps/api/prisma/schema.prisma

      - name: Build shared packages and services
        run: npm run build

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Verify Android Metro bundle export
        working-directory: apps/mobile
        run: |
          npx expo export --platform android --no-bytecode --output-dir .expo-verify
          rm -rf .expo-verify
